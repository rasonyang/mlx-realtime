# mlx-realtime with every provider a mock (the M1 setup): no model backends. Speech detection is
# the real Silero VAD on CPU (`make models` fetches it), with the barge-in rules of config.yaml,
# so AICC's barge-in scenarios run against it (M4). The echo canceller is off here: the mock TTS
# speaks a sine tone, and with no echo on the line WebRTC AEC3 takes a caller talking over a
# sine for echo and silences them (it does not with speech; tests/integration/test_echo.py runs
# the canceller on speech).
# Used by the tests and the e2e suite: `uv run --locked mlxrt --config config.mock.yaml dev`.
# Any key can be overridden with MLXRT__<SECTION>__<KEY>=<YAML value>, for example
# MLXRT__GATEWAY__PORT=9000 or MLXRT__PROVIDERS__LLM__TOKEN_DELAY_MS=5.
# An unknown key or a bad value stops startup and names the dotted path.

gateway:
  host: 127.0.0.1
  port: 8000
  max_sessions: 8
  api_key: ""              # empty: no authentication
  max_session_s: 3600

limits:
  client_max_message_bytes: 16777216   # GA allows 15 MiB of base64 per append
  inbox_max_ms: 2000                   # queued input audio before the session fails
  inbox_max_commands: 256
  input_audio_buffer_max_ms: 60000
  outbound_queue_events: 256
  client_write_timeout_ms: 5000
  max_response_audio_ms: 120000

output:
  max_delta_ms: 100
  max_lead_ms: 10000       # D6

lines:                     # D16: verbatim lines skip the LLM
  verbatim_prefixes:
    - "Say exactly this, word for word, and add nothing else:\n"
    - "请一字不差地说出下面这句话，不要添加任何其它内容：\n"

voices:                    # D19: the built-in voice map (config.yaml lists it in full)
  default: vivian

# GA-shaped; echoed in session.created and validated exactly like a session.update.
session_defaults:
  model: mlx-realtime
  instructions: "You are a helpful voice assistant. Answer briefly."
  output_modalities: [audio]
  audio:
    input:
      format: {type: audio/pcm, rate: 24000}
      transcription: {model: qwen3-asr}
      turn_detection: {type: server_vad, threshold: 0.5, prefix_padding_ms: 300,
                       silence_duration_ms: 200, create_response: true, interrupt_response: true}
    output:
      format: {type: audio/pcm, rate: 24000}
      voice: vivian
      speed: 1.0

turn:
  vad: {type: silero, model: models/silero_vad.onnx, min_speech_ms: 150, model_reset_interval_s: null}
  smart_turn: {enabled: false, threshold: 0.5, max_silence_ms: 3000, window_s: 8}   # silence ends a turn

aec:                       # D17: as config.yaml, but off (see the top of this file)
  enabled: false
  engine: webrtc_aec3
  asr_input: processed
  reference_lead_ms: 60
  learn_tick_phase: true
  min_residual_delay_ms: 5
  max_residual_delay_ms: 450

barge_in:                  # D17's second line of defence: as config.yaml
  echo_guard_ms: 2000
  min_speech_ms_while_playing: 400
  echo_turn_suppression: true

text:
  segmenter: {first_min_chars: 4, first_max_wait_ms: 400, min_chars: 8, max_chars: 80}
  normalizer: {enabled: true}   # the G5 defaults (config.yaml lists every key)

providers:
  llm: {type: mock, first_token_delay_ms: 50, token_delay_ms: 20, greeting: "你好，有什么可以帮您？"}
  asr: {type: mock, delay_ms: 50, transcripts: ["你好，我想查询一下账户余额。"]}
  tts: {type: mock, first_chunk_delay_ms: 50, chunk_delay_ms: 0, chunk_ms: 80, ms_per_char: 60,
        frequency_hz: 440.0}

observability:
  log_level: info
