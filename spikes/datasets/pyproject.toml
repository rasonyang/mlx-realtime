[project]
name = "spike-datasets"
version = "0.1.0"
description = "M0 spike S0 (work package A2): public test audio, telephone copies, manifest and echo material. Throwaway."
# stdlib audioop (used for the G.711 round trip) was removed in Python 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pyarrow>=26.0.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[tool.uv]
required-version = ">=0.13.5"
