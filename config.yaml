# mlx-realtime configuration (ARCHITECTURE §10). M3: Silero VAD and Smart Turn on CPU, the ASR, LLM
# and TTS backends (Qwen3-TTS, with Kokoro as the fallback). config.mock.yaml runs every provider as
# a mock.
# Any key can be overridden with MLXRT__<SECTION>__<KEY>=<YAML value>, for example
# MLXRT__GATEWAY__PORT=9000 or MLXRT__PROVIDERS__LLM__TEMPERATURE=0.6.
# An unknown key or a bad value stops startup and names the dotted path.
# Model files: `uv run --locked mlxrt models` (ONNX), `mlxrt models --mlx` (the MLX repos below).

gateway:
  host: 127.0.0.1
  port: 8000
  max_sessions: 8
  api_key: ""              # empty: no authentication
  max_session_s: 3600

limits:
  client_max_message_bytes: 16777216   # GA allows 15 MiB of base64 per append
  inbox_max_ms: 2000                   # queued input audio before the session fails
  inbox_max_commands: 256
  input_audio_buffer_max_ms: 60000
  outbound_queue_events: 256
  client_write_timeout_ms: 5000
  max_response_audio_ms: 120000

output:
  max_delta_ms: 100        # audio per response.output_audio.delta
  max_lead_ms: 10000       # D6: audio goes out at once, at most this far ahead of real time

# D16: a response whose own instructions start with one of these is spoken as written, without
# the LLM (AICC's greetings, announces, wait and closing lines). [] turns lines off.
lines:
  verbatim_prefixes:
    - "Say exactly this, word for word, and add nothing else:\n"
    - "请一字不差地说出下面这句话，不要添加任何其它内容：\n"

# D19: the session voice names (audio.output.voice). Any other name is accepted, spoken by
# `default`, logged as a warning and echoed as the effective voice. speaker: the Qwen3-TTS
# speaker; lang: "segment" (each segment's zh/en tag) or a fixed lang_code; fallback: the Kokoro
# voice for zh and for en segments. Not offered: dylan and eric (dialects with chinese/auto).
# Pending B2 (S3): the default speaker for zh and en.
voices:
  default: vivian
  map:
    vivian:   {speaker: vivian,   lang: segment, fallback: {zh: zf_xiaobei,  en: af_heart}}
    serena:   {speaker: serena,   lang: segment, fallback: {zh: zf_xiaoxiao, en: af_bella}}
    uncle_fu: {speaker: uncle_fu, lang: segment, fallback: {zh: zm_yunjian,  en: am_adam}}
    ryan:     {speaker: ryan,     lang: segment, fallback: {zh: zm_yunxi,    en: am_michael}}
    aiden:    {speaker: aiden,    lang: segment, fallback: {zh: zm_yunyang,  en: am_puck}}

# GA-shaped; echoed in session.created and validated exactly like a session.update.
session_defaults:
  model: mlx-realtime
  instructions: "You are a helpful voice assistant. Answer briefly."
  output_modalities: [audio]
  audio:
    input:
      format: {type: audio/pcm, rate: 24000}
      transcription: {model: qwen3-asr}               # on by default (D15)
      turn_detection: {type: server_vad, threshold: 0.5, prefix_padding_ms: 300,
                       silence_duration_ms: 200, create_response: true, interrupt_response: true}
    output:
      format: {type: audio/pcm, rate: 24000}
      voice: vivian                                   # a name from voices.map
      speed: 1.0

turn:
  vad: {type: silero, model: models/silero_vad.onnx, min_speech_ms: 150, model_reset_interval_s: null}
  # G3: the fp32 file on CPU, 2 intra-op threads, 2 workers.
  smart_turn: {enabled: true, model: models/smart-turn-v3.2-gpu.onnx, threshold: 0.5,
               max_silence_ms: 3000, window_s: 8, workers: 2, intra_op_threads: 2}

# D17 (G7): the per-session echo canceller, WebRTC AEC3 through pywebrtc-audio, on its own CPU
# executor. Its reference is our output on a model of AICC's playout: a 20 ms tick, playback
# from 3 queued frames (60 ms), a re-buffer after more than 2 empty ticks; the reference leads
# by 60 ms. A GCC-PHAT guard re-aligns it only when the residual delay leaves
# [min_residual_delay_ms, max_residual_delay_ms], and learns AICC's tick phase.
# asr_input: what the ASR transcribes (pending M0's double-talk ΔCER): processed | raw.
aec:
  enabled: true
  engine: webrtc_aec3
  asr_input: processed
  workers: 2
  client_tick_ms: 20
  client_prebuffer_ms: 60
  client_underrun_ticks: 2
  reference_lead_ms: 60
  learn_tick_phase: true
  delay_guard: true
  min_residual_delay_ms: 5
  max_residual_delay_ms: 450

# D17's second line of defence while the client is modelled as playing our audio:
# no barge-in from an onset in the first echo_guard_ms of a response's playback, speech must
# last min_speech_ms_while_playing (null: turn.vad.min_speech_ms) during playback, and a turn
# whose transcript matches what we were playing is treated as noise (D7). Each rule can be
# switched off (0, null, false).
barge_in:
  echo_guard_ms: 2000
  min_speech_ms_while_playing: 400
  echo_turn_suppression: true
  echo_match_threshold: 0.7
  echo_match_min_units: 4
  echo_match_window_ms: 3000

text:
  segmenter: {first_min_chars: 4, first_max_wait_ms: 400, min_chars: 8, max_chars: 80}
  # TTS input only; transcripts keep the original text. Pending S9 (G5): which categories the TTS
  # reads wrongly by itself. Until then phone numbers and IDs only.
  normalizer: {enabled: true, numbers: false, money: false, dates: false, phones: true, ids: true,
               units: false, spacing: false, phone_one_as_yao: true}

providers:
  llm:
    type: mlx_lm_chat
    base_url: http://127.0.0.1:8101
    # No `model`: requests leave it out, so the server uses the snapshot it was started on.
    max_completion_tokens: 512   # placeholder until G2
    temperature: 0.7             # placeholder until G2
    top_p: 0.8                   # placeholder until G2
    empty_conversation_cue: "(The conversation has just started.)"
    system_note: "(System note: {text})"
    max_in_flight: 8
    queue_timeout_ms: 1000
    timeouts: {connect_ms: 500, first_item_ms: 5000, idle_ms: 3000, total_ms: 60000,
               warmup_ms: 600000}
  asr:
    type: mlx_audio_transcription
    base_url: http://127.0.0.1:8102
    model: mlx-community/Qwen3-ASR-1.7B-8bit
    max_in_flight: 4
    queue_timeout_ms: 1000
    timeouts: {connect_ms: 500, first_item_ms: 5000, idle_ms: 2000, total_ms: 10000,
               warmup_ms: 300000}
  tts:
    type: mlx_audio_speech
    base_url: http://127.0.0.1:8103
    sample_rate: 24000
    max_in_flight: 1             # the server runs one stream at a time; the rest queue here
    queue_timeout_ms: 2000       # then backend_busy
    warmup_texts: {zh: "您好，请问有什么可以帮您？", en: "Hello, how can I help you?"}
    primary:
      model: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit
      family: qwen3_tts
      lang_codes: {zh: chinese, en: english}
      streaming_interval: 0.32   # pending B2 (S3): 4 codec frames, first chunk ~110 ms in M0
      # Sampling: unset, the model's generation_config.json applies (temperature 0.9, top_k 50,
      # top_p 1.0, repetition_penalty 1.05). Pending B2 (S3 quality guardrail).
      timeouts: {connect_ms: 500, first_item_ms: 1500, idle_ms: 1000, total_ms: 60000,
                 warmup_ms: 300000}
    fallback:                    # D13: pending B2 (S3.6, G6) evidence on Kokoro's zh and mixed text
      enabled: true
      model: mlx-community/Kokoro-82M-bf16
      family: kokoro             # voice packs from the pinned snapshot's voices/ (offline-safe)
      lang_codes: {zh: z, en: a}
      streaming_interval: 0.32
      breaker_failures: 3        # consecutive primary failures that send every segment here
      cooldown_s: 30
      timeouts: {connect_ms: 500, first_item_ms: 2000, idle_ms: 2000, total_ms: 60000,
                 warmup_ms: 300000}

# The model processes `make dev` starts: uv run --locked --project <project> <command>
# --host <host> --port <port> [--model <local snapshot of model>] <args>.
backends:
  env: {HF_HUB_OFFLINE: "1"}   # every model is fetched ahead of time; none is fetched mid-call
  llm:
    project: backends/llm
    command: [mlx_lm.server]
    port: 8101
    # Placeholder until G2 picks the repo and revision (this is the revision M0 downloaded).
    model: {repo: mlx-community/Qwen3.6-35B-A3B-4bit, revision: 38740b847e4cb78f352aba30aa41c76e08e6eb46}
    # Thinking off server-wide (and per request). Length and sampling: placeholders until G2.
    args: [--chat-template-args, '{"enable_thinking":false}', --max-tokens, "512", --temp, "0.7",
           --top-p, "0.8"]
  asr:
    project: backends/audio
    command: [mlx_audio.server]
    port: 8102
    fetch: [{repo: mlx-community/Qwen3-ASR-1.7B-8bit, revision: a8379a2e2f9e313c9292cdf1af4055ab56d50d55}]
    args: [--log-dir, /tmp/mlxrt-asr]
  tts:
    project: backends/audio
    command: [mlx_audio.server]
    port: 8103
    fetch:
      - {repo: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit, revision: 049ef77fe8816b536193c0c25f9a214d17921282}
      - {repo: mlx-community/Kokoro-82M-bf16, revision: a71e4d38b236d968966a2002c4c895dbd12b1c3c}
    args: [--log-dir, /tmp/mlxrt-tts]

observability:
  log_level: info
