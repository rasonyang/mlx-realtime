# mlx-realtime configuration (ARCHITECTURE §10). M5: Silero VAD and Smart Turn on CPU, the ASR, LLM
# and TTS backends (Qwen3-TTS 8-bit, with its 4-bit build as the fallback, D13). config.mock.yaml
# runs every provider as a mock.
# Any key can be overridden with MLXRT__<SECTION>__<KEY>=<YAML value>, for example
# MLXRT__GATEWAY__PORT=9000 or MLXRT__PROVIDERS__LLM__TEMPERATURE=0.6.
# An unknown key or a bad value stops startup and names the dotted path.
# Model files: `uv run --locked mlxrt models` (ONNX), `mlxrt models --mlx` (the MLX repos below).

gateway:
  host: 127.0.0.1
  port: 8000
  # The Mac's capacity target (owner): 3 concurrent calls (2026-10-23), raised to 4 sessions on
  # 2026-10-24 for AICC's human-call transcription (issue #2): each human call opens two
  # transcription sessions (one per leg), which run no LLM and no TTS but share the ASR queue.
  max_sessions: 4
  api_key: ""              # empty: no authentication
  max_session_s: 3600

limits:
  client_max_message_bytes: 16777216   # GA allows 15 MiB of base64 per append
  inbox_max_ms: 2000                   # queued input audio before the session fails
  inbox_max_commands: 256
  input_audio_buffer_max_ms: 60000
  outbound_queue_events: 256
  client_write_timeout_ms: 5000
  max_response_audio_ms: 120000

output:
  max_delta_ms: 100        # audio per response.output_audio.delta
  max_lead_ms: 10000       # D6: audio goes out at once, at most this far ahead of real time
  # M0 S3: Qwen3-TTS adds ~0.45 s of silence before and ~0.5 s after every segment. An energy
  # gate on 20 ms frames keeps at most max_lead_ms / max_tail_ms of it; the first voiced frame
  # goes out at once, inner pauses are kept.
  trim_silence: {enabled: true, threshold_dbfs: -50, frame_ms: 20, max_lead_ms: 60, max_tail_ms: 100}
  # M6: while a response has segments to come, hold back up to hold_ms of its audio and release
  # it a delta at a time: after keepalive_ms without a delta (AICC's watchdog is 2 s), or when
  # the client's modelled buffer drops below min_lead_ms. Keeps deltas flowing while the next
  # segment waits in the shared TTS queue.
  # Real stack (2026-10-23): with two sessions, a next segment waited 2.3 s behind another
  # session's long one after the reserve was spent; keepalive_silence then sends 20 ms of
  # silence every keepalive_ms until it comes (the caller hears the same pause).
  reserve: {enabled: true, hold_ms: 1500, keepalive_ms: 1000, min_lead_ms: 400,
            keepalive_silence: true}

# M7: G.711 sessions (audio/pcmu, audio/pcma at 8 kHz). soxr quality of the caller's 8 -> 16 kHz
# step (LQ: 32 ms mean lag vs HQ's 64, M0 S7; -8 dB at 3.4 kHz) and of the TTS's 24 -> 8 kHz.
g711: {input_quality: LQ, output_quality: HQ}

# D16: a response whose own instructions start with one of these is spoken as written, without
# the LLM (AICC's greetings, announces, wait and closing lines). [] turns lines off.
lines:
  verbatim_prefixes:
    - "Say exactly this, word for word, and add nothing else:\n"
    - "请一字不差地说出下面这句话，不要添加任何其它内容：\n"

# D19: the session voice names (audio.output.voice). Any other name is accepted, spoken by
# `default`, logged as a warning and echoed as the effective voice. speaker: the Qwen3-TTS
# speaker, on the primary and the fallback alike (D13: both are builds of one model); lang:
# "segment" (each segment's zh/en tag) or a fixed lang_code; speakers: a speaker per segment
# language instead of `speaker`. S3: vivian reads zh, en and mixed (0% WER on en); aiden is the
# en-only default. Not offered: dylan and eric (dialects with chinese/auto), ryan (the runaway
# defect, mlx-audio#1002).
voices:
  default: vivian
  map:
    vivian:   {speaker: vivian,   lang: segment}
    serena:   {speaker: serena,   lang: segment}
    uncle_fu: {speaker: uncle_fu, lang: segment}
    aiden:    {speaker: aiden,    lang: segment}

# GA-shaped; echoed in session.created and validated exactly like a session.update.
session_defaults:
  model: mlx-realtime
  instructions: "You are a helpful voice assistant. Answer briefly."
  output_modalities: [audio]
  audio:
    input:
      format: {type: audio/pcm, rate: 24000}
      transcription: {model: qwen3-asr}               # on by default (D15)
      turn_detection: {type: server_vad, threshold: 0.5, prefix_padding_ms: 300,
                       silence_duration_ms: 200, create_response: true, interrupt_response: true}
    output:
      format: {type: audio/pcm, rate: 24000}
      voice: vivian                                   # a name from voices.map
      speed: 1.0

turn:
  vad: {type: silero, model: models/silero_vad.onnx, min_speech_ms: 150, model_reset_interval_s: null}
  # G3: the fp32 file on CPU, 2 intra-op threads, 2 workers.
  smart_turn: {enabled: true, model: models/smart-turn-v3.2-gpu.onnx, threshold: 0.5,
               max_silence_ms: 3000, window_s: 8, workers: 2, intra_op_threads: 2}

# D17 (G7 dual path): per session, WebRTC AEC3 through pywebrtc-audio cleans what Silero and Smart
# Turn hear, and asr_input names what the ASR transcribes: speex (a SpeexDSP linear canceller,
# vendored in vendor/speexdsp-aec), aec3 (its suppressor drops quiet caller speech in double
# talk: M0 S11) or raw. Both run on the canceller executor (workers threads, shared by sessions).
# Their reference is our output on a model of AICC's playout: a 20 ms tick, playback from 3
# queued frames (60 ms), a re-buffer after more than 2 empty ticks; the reference leads by 60 ms.
# A GCC-PHAT estimator re-aligns AEC3's reference only when the residual delay leaves
# [min_residual_delay_ms, max_residual_delay_ms], learns AICC's tick phase, and places Speex's
# reference target_delay_ms ahead of the echo, moving it only when the echo leaves
# [0, max_delay_ms]. Until its first estimate (~2.5 s into the first answer) the ASR hears the
# input uncancelled. prefilter_hz: a low-pass on Speex's inputs (AICC's upsampling images);
# preprocess: SpeexDSP's preprocessor after the filter (denoise, residual-echo suppression).
# Measured (spikes/g7dual): double-talk dCER within M0's C2 limits with both on.
aec:
  enabled: true
  engine: webrtc_aec3
  asr_input: speex
  speex: {filter_ms: 64, target_delay_ms: 20, max_delay_ms: 44, prefilter_hz: 3800,
          preprocess: true}
  workers: 2
  client_tick_ms: 20
  client_prebuffer_ms: 60
  client_underrun_ticks: 2
  reference_lead_ms: 60
  learn_tick_phase: true
  delay_guard: true
  min_residual_delay_ms: 5
  max_residual_delay_ms: 450
  # Dev only (spikes/live_echo): capture_dir turns on a per-session recording of the echo path
  # under that directory (input, both references, both cancellers' outputs, events, meta), at
  # most capture_max_s of input per session. The files contain the caller's voice and
  # transcripts: never in production, never committed. null: off.
  capture_dir: null
  capture_max_s: 900

# D17's second line of defence while the client is modelled as playing our audio:
# no barge-in from an onset in the first echo_guard_ms of a response's playback, speech must
# last min_speech_ms_while_playing (null: turn.vad.min_speech_ms) during playback, and a turn
# whose transcript matches what we were playing is treated as noise (D7). Each rule can be
# switched off (0, null, false).
# confirm_while_playing (issue #5): speech_started that would go out while the client plays our
# audio (the queued tail of a finished answer included) waits until the ASR hears the caller:
# partial transcripts of the turn (a first one at once, then each confirm_step_ms of new audio,
# over at most the last confirm_window_ms) are compared with the assistant text played around it,
# and the turn is released once confirm_min_new_units of its words are not ours (1 once nothing
# plays). When the speech pauses, one check covers the whole utterance (none runs through the
# silence): a word that is not ours releases a short one, and an echo of 4 words or more
# (echo_match_min_units) or nothing is dropped, with no event at all, when the turn ends. The end
# of the playback alone releases nothing. An ASR error or a check over confirm_timeout_ms
# releases the turn. While AEC3 is in its no-echo bypass, each check also correlates the raw input
# over the held speech with our played audio (GCC-PHAT, lags 0-1 s): a peak-to-sidelobe ratio of
# confirm_echo_psr or more keeps a would-be release held (the ASR can mishear a leak as other
# words), and at the turn's end confirm_echo_drop_psr or more drops it as echo (null: never on the
# correlation alone; confirm_echo_psr null: no correlation). On simulated leaks 15 holds every
# leak 10 holds, and a caller who talks over a loud leak for less long; no real caller was
# dropped at any drop threshold (spikes/live_echo/results/hold_gcc.md, hold_v3.md).
# false: speech_started goes out at the onset, as before.
barge_in:
  echo_guard_ms: 2000
  min_speech_ms_while_playing: 400
  echo_turn_suppression: true
  echo_match_threshold: 0.7
  echo_match_min_units: 4
  echo_match_window_ms: 3000
  confirm_while_playing: true
  confirm_min_new_units: 2
  confirm_step_ms: 250
  confirm_window_ms: 4000
  confirm_timeout_ms: 2000
  confirm_echo_psr: 15
  confirm_echo_drop_psr: 15

# Transcription sessions (session.type "transcription", issue #2): no VAD, no echo cancellation,
# no LLM, no TTS. The client sends audio continuously and commits after each utterance. While no
# 20 ms frame has an RMS of voiced_rms, the buffer keeps only the last idle_keep_ms (a 90 s hold
# holds ~1 s); a commit with nothing voiced is answered empty without asking the ASR. Speech
# longer than limits.input_audio_buffer_max_ms loses its oldest audio, logged; the session lives.
# voiced_rms 400 (spikes/transcription, docs/PROGRESS.md): AICC commits only after a frame of RMS 500,
# so every utterance it ends is voiced; line noise of RMS 80-200 on the G.711 tap was voiced at 100,
# kept up to 58 s of noise in front of an utterance, and Qwen3-ASR answered it with the prompt's terms.
# min_speech_ms 224, speech_threshold 0.5: a voiced commit goes to the ASR only if Silero finds 224 ms
# (7 frames) of speech in it, else it is answered with an empty transcript and no ASR request
# (mlxrt_transcription_skipped). AICC's pump commits hold music and DTMF (RMS above 500); Qwen3-ASR
# answers them with the prompt or runs on. spikes/transcription: all 16 such commits of the corpus
# have at most 192 ms of speech; 40 of 1908 real commits (2.1 %, mostly one-word answers) are skipped.
# 0 disables.
transcription: {idle_keep_ms: 1000, voiced_rms: 400, min_speech_ms: 224, speech_threshold: 0.5}

text:
  segmenter: {first_min_chars: 4, first_max_wait_ms: 400, min_chars: 8, max_chars: 80}
  # TTS input only; transcripts keep the original text. G5 (M0 S9): only what Qwen3-TTS misreads
  # by itself: phone numbers (with 尾号 and extensions, 1 read as 幺), IDs, e-mail addresses ("@"
  # and "." spoken), cardinals of min_cardinal_digits or more digits, and in English text numeric
  # dates and amounts from en_amount_min. Money, decimals, percentages, ordinals, dates and times,
  # units, URLs and brand names stay as written (each category can be switched on).
  normalizer: {enabled: true, phones: true, ids: true, emails: true, cardinals: true,
               min_cardinal_digits: 5, en_dates: true, en_amounts: true, en_amount_min: 1000,
               numbers: false, money: false, dates: false, units: false, spacing: false,
               phone_one_as_yao: true}

providers:
  llm:
    type: mlx_lm_chat
    base_url: http://127.0.0.1:8101
    # No `model`: requests leave it out, so the server uses the snapshot it was started on.
    # G2 (M0 S1): requests with tools attached are greedy (19/20 expected calls); the others use
    # the server's sampling (backends.llm.args).
    max_completion_tokens: 512
    temperature: 0.7
    top_p: 0.8
    tool_temperature: 0.0
    tool_top_p: 1.0
    retry_dropped_call: true     # a call the server's parser dropped, before any text: asked again
    warm_on_update: true         # new instructions or tools: warm the server's prompt cache (S2)
    max_warmups_in_flight: 1     # one per prefix; a burst of calls with one flow warms it once
    empty_conversation_cue: "(The call has connected. Greet the caller as instructed.)"
    system_note: "(System note: {text})"
    # M5 history shaping (the Qwen template): a tool result always follows its call. A wait
    # line spoken between a call and its result is merged into the call's message (merge) or
    # placed after the result (after_output); a call still unanswered gets a placeholder
    # result (pending), none (keep), or is left out (drop). Pending the M0 LLM spike.
    tool_interlude: merge
    unanswered_calls: pending
    pending_tool_output: '{"status": "pending", "note": "The result has not arrived yet."}'
    max_in_flight: 5             # 4 sessions (gateway.max_sessions), one response each, plus a warm-up
    queue_timeout_ms: 1000
    timeouts: {connect_ms: 500, first_item_ms: 5000, idle_ms: 3000, total_ms: 60000,
               warmup_ms: 600000}
  asr:
    type: mlx_audio_transcription
    base_url: http://127.0.0.1:8102
    model: mlx-community/Qwen3-ASR-1.7B-8bit
    max_in_flight: 4             # one turn per session (gateway.max_sessions), transcription sessions too
    # Words to expect (brand and product names, at most 1024 characters), sent as the ASR context
    # of every turn whose session sets no transcription.prompt; a session prompt replaces it.
    # Unset: turns carry no context. Example: "NovaNet, Wi-Fi 7, eSIM, 5G 畅享 199". Name terms,
    # not example codes (the ASR copies them into transcripts); ~300 characters cost ~60 ms a
    # turn at one call (spikes/asr_context).
    # context: ...
    # max_tokens per request = base + per_s x seconds of audio sent (every request, realtime and
    # transcription sessions alike). spikes/transcription: the densest corpus utterance needs 5.1
    # tokens per second of speech (3.6 with the pump's silence), so 16 + 10 x s leaves 2.6x. Without
    # it Qwen3-ASR ran to 8192 tokens on hold music and DTMF (30-60 s of the one ASR stream, which
    # does not stop when the gateway gives up): a 3 s DTMF burst now ends after 46 tokens, a 60 s
    # hold after 616. null: no cap.
    token_cap: {base: 16, per_s: 10}
    queue_timeout_ms: 1000
    timeouts: {connect_ms: 500, first_item_ms: 5000, idle_ms: 2000, total_ms: 10000,
               warmup_ms: 300000}
  tts:
    type: mlx_audio_speech
    base_url: http://127.0.0.1:8103
    sample_rate: 24000
    max_in_flight: 1             # the server runs one stream at a time; the rest queue here
    # M6: edf serves first the request whose session runs out of audio soonest; a first segment
    # (no audio yet) counts from its response's start, plus first_segment_grace_ms. fifo: arrival.
    scheduling: edf
    first_segment_grace_ms: 0
    queue_timeout_ms: 2000       # past the request's deadline; then backend_busy
    warmup_texts: {zh: "您好，请问有什么可以帮您？", en: "Hello, how can I help you?"}
    primary:
      model: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit
      lang_codes: {zh: chinese, en: english}
      streaming_interval: 0.16   # S3: 2 codec frames per chunk, first chunk ~76 ms uncapped
      # S3: max_tokens in proportion to the text, so a runaway stops early (not at 1200 frames):
      # base + per_cjk per CJK character + per_other per other letter or digit, 12.5 per second.
      token_cap: {base: 25, per_cjk: 6, per_other: 2}
      # Sampling: unset, the model's generation_config.json applies (temperature 0.9, top_k 50,
      # top_p 1.0, repetition_penalty 1.05). Pending B2 (S3 quality guardrail).
      timeouts: {connect_ms: 500, first_item_ms: 1500, idle_ms: 1000, total_ms: 60000,
                 warmup_ms: 300000}
    # D13 (owner): a segment the primary fails before its first chunk is spoken by the 4-bit build
    # of the same model, in the same speaker, Latin letters included; it is asked just like the
    # primary. Its warmup speaks the default voice only (the primary's tries every voice).
    fallback:
      enabled: true
      model: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-4bit
      lang_codes: {zh: chinese, en: english}
      streaming_interval: 0.16
      token_cap: {base: 25, per_cjk: 6, per_other: 2}
      breaker_failures: 3        # consecutive primary failures that send every segment here
      cooldown_s: 30
      timeouts: {connect_ms: 500, first_item_ms: 1500, idle_ms: 1000, total_ms: 60000,
                 warmup_ms: 300000}

# The model processes `make dev` starts: uv run --locked --project <project> <command>
# --host <host> --port <port> [--model <local snapshot of model>] <args>.
backends:
  env: {HF_HUB_OFFLINE: "1"}   # every model is fetched ahead of time; none is fetched mid-call
  llm:
    project: backends/llm
    # mlx_lm.server with the lenient qwen3_coder tool-call parser (backends/llm, G2); same CLI.
    command: [python, -m, mlxrt_llm.serve]
    port: 8101
    model: {repo: mlx-community/Qwen3.6-35B-A3B-4bit, revision: 38740b847e4cb78f352aba30aa41c76e08e6eb46}
    # G2: thinking off server-wide (and per request); the model card's non-thinking sampling.
    # LLM hardening: 64 cached prompts, at most 8 GB (~100 MB each; +6 GB resident); cache
    # checkpoints where the tool definitions end and where instructions stop matching recent
    # ones (an AICC phase change then prefills ~190 tokens, not ~1650); hits keep entries alive.
    args: [--chat-template-args, '{"enable_thinking":false}', --max-tokens, "2048", --temp, "0.7",
           --top-p, "0.8", --top-k, "20", --min-p, "0.0", --prompt-cache-size, "64",
           --prompt-cache-bytes, 8GB, --tools-checkpoint, --shared-prefix-checkpoint]
  asr:
    project: backends/audio
    # mlx_audio.server with the context form field handed to Qwen3-ASR as its system prompt
    # (backends/audio); same CLI.
    command: [python, -m, mlxrt_audio.serve]
    port: 8102
    fetch: [{repo: mlx-community/Qwen3-ASR-1.7B-8bit, revision: a8379a2e2f9e313c9292cdf1af4055ab56d50d55}]
    args: [--log-dir, /tmp/mlxrt-asr]
  tts:
    project: backends/audio
    command: [mlx_audio.server]
    port: 8103
    fetch:
      - {repo: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit, revision: 049ef77fe8816b536193c0c25f9a214d17921282}
      - {repo: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-4bit, revision: 08c72cad5e2fd0f41730c8bd1f28149585e46361}
    args: [--log-dir, /tmp/mlxrt-tts]

observability:
  log_level: info
  quantile_window_turns: 200   # /metrics: P50/P95 gauges over each stage's last N turns
  # GET /debug/turns?session_id=...: each turn's marks and stage durations, for bench/ (D8).
  # Unauthenticated, like /metrics; keep it off in service.
  debug_endpoints: false
  debug_sessions: 64
  debug_turns_per_session: 500
