[project]
name = "mlx-realtime"
version = "0.1.0"
description = "A local OpenAI Realtime (GA) voice service on Apple Silicon"
readme = "README.md"
authors = [
    { name = "rason yang", email = "rason.yang@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.16.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "soxr>=1.1.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
    "websockets>=15.0.1,<16",
]

[project.scripts]
mlxrt = "mlx_realtime.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"

[dependency-groups]
dev = [
    "openai[realtime]==3.36.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "transformers>=5.20.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Python only: ruff would otherwise reformat code blocks inside the Markdown docs.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TID", "C4", "PIE", "RET", "PERF"]
# Chinese text and its full-width punctuation are data here, not confusable look-alikes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mlx".msg = "The gateway never imports MLX; model code lives in backends/ (ARCHITECTURE §4.1)."
"mlx_lm".msg = "The gateway never imports MLX; model code lives in backends/ (ARCHITECTURE §4.1)."
"mlx_audio".msg = "The gateway never imports MLX; model code lives in backends/ (ARCHITECTURE §4.1)."

[tool.pyright]
include = ["src", "tests"]
exclude = ["spikes", "**/.venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "e2e: the official openai SDK against a running gateway with mock providers",
    "backend: needs the real model backends (make dev); skipped unless selected with -m backend",
]
filterwarnings = ["error"]
